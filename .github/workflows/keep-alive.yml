name: Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  database_heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Validate required secrets
        run: |
          missing=0
          [ -z "${{ secrets.SUPABASE_URL }}" ] && echo "::error::SUPABASE_URL secret is missing" && missing=1
          [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ] && echo "::error::SUPABASE_ANON_KEY secret is missing" && missing=1
          [ "$missing" -eq 1 ] && exit 1 || true

      - name: Execute Live Supabase Health Check
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          max_attempts=3
          attempt=1
          until [ $attempt -gt $max_attempts ]; do
            http_code=$(curl -s -o response.json -w "%{http_code}" \
              "${SB_URL}/auth/v1/health" \
              -H "apikey: ${SB_KEY}")

            echo "Attempt $attempt — HTTP status: $http_code"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Supabase heartbeat OK ($http_code)"
              exit 0
            fi

            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
            attempt=$((attempt + 1))
          done

          echo "::error::Supabase heartbeat failed after $max_attempts attempts"
          cat response.json
          exit 1

      - name: Update heartbeat file and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Automation Bot"

          echo "Last heartbeat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > library_heartbeat.txt

          git add library_heartbeat.txt
          git commit -m "chore: keep-alive heartbeat" || { echo "Nothing to commit"; exit 0; }

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://ntfy.sh/faiz-keepalive-alerts-9f3k" \
            -H "Title: Keep Alive workflow failed" \
            -H "Priority: high" \
            -d "Repo: ${{ github.repository }} | Run: ${{ github.run_id }} | Check the Actions tab now."
